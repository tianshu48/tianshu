name: Mirror releases to GitCode

on:
  release:
    types: [published, edited, released, prereleased]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to sync (empty = every GitHub release)"
        required: false
        type: string

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Sync GitHub release(s) to GitCode
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          test -n "${GITCODE_TOKEN:-}"
          API="https://api.gitcode.com/api/v5"
          enc() { jq -nr --arg v "$1" '$v|@uri'; }
          gitcode_get() {
            curl -fsS --retry 4 --retry-all-errors \
              -H "Authorization: Bearer ${GITCODE_TOKEN}" \
              "$1"
          }
          existing_names() {
            local tag="$1"
            gitcode_get "${API}/repos/${GITHUB_REPOSITORY}/releases/tags/$(enc "$tag")" \
              | jq -r '.assets[]?.name // empty' || true
          }
          upload_file() {
            local tag="$1" file="$2"
            local filename upload_json url
            filename="$(basename "$file")"
            echo "upload $filename ($(wc -c <"$file") bytes)"
            upload_json="$(mktemp)"
            curl -fsS --retry 4 --retry-all-errors \
              -H "Authorization: Bearer ${GITCODE_TOKEN}" \
              -o "$upload_json" \
              "${API}/repos/${GITHUB_REPOSITORY}/releases/$(enc "$tag")/upload_url?file_name=$(enc "$filename")"
            url="$(jq -r .url "$upload_json")"
            test -n "$url" && test "$url" != null
            curl -fsS --retry 4 --retry-all-errors \
              --connect-timeout 30 --max-time 900 \
              -X PUT \
              -H "x-obs-meta-project-id: $(jq -r '.headers["x-obs-meta-project-id"]' "$upload_json")" \
              -H "x-obs-acl: $(jq -r '.headers["x-obs-acl"]' "$upload_json")" \
              -H "x-obs-callback: $(jq -r '.headers["x-obs-callback"]' "$upload_json")" \
              -H "Content-Type: $(jq -r '.headers["Content-Type"]' "$upload_json")" \
              --upload-file "$file" \
              "$url"
            echo "uploaded $filename"
          }
          sync_one() {
            local tag="$1" dir title pre body payload have
            dir="$(mktemp -d)"
            gh release view "$tag" -R "$GITHUB_REPOSITORY" --json name,body,isPrerelease,tagName,isDraft,targetCommitish >"$dir/meta.json"
            if [ "$(jq -r .isDraft "$dir/meta.json")" = true ]; then
              echo "skip draft $tag"
              return 0
            fi
            title="$(jq -r .name "$dir/meta.json")"
            body="$(jq -r '.body // ""' "$dir/meta.json")"
            pre="$(jq -r .isPrerelease "$dir/meta.json")"
            jq -n --arg tag "$tag" --arg name "$title" --arg body "$body" --arg pre "$pre" \
              '{tag_name:$tag,name:$name,body:$body,release_status:(if $pre=="true" then "pre" else "latest" end)}' \
              >"$dir/create.json"
            if gitcode_get "${API}/repos/${GITHUB_REPOSITORY}/releases/tags/$(enc "$tag")" >/dev/null 2>&1; then
              echo "GitCode release $tag exists"
            else
              curl -fsS --retry 4 --retry-all-errors \
                -H "Authorization: Bearer ${GITCODE_TOKEN}" \
                -H "Content-Type: application/json" \
                -d @"$dir/create.json" \
                -X POST "${API}/repos/${GITHUB_REPOSITORY}/releases"
              echo
              echo "created GitCode release $tag"
            fi
            mkdir -p "$dir/assets"
            gh release download "$tag" -R "$GITHUB_REPOSITORY" -D "$dir/assets" --clobber
            have="$(existing_names "$tag")"
            shopt -s nullglob
            local f filename
            for f in "$dir/assets"/*; do
              filename="$(basename "$f")"
              if printf '%s\n' "$have" | grep -Fxq "$filename"; then
                echo "skip existing $filename"
                continue
              fi
              upload_file "$tag" "$f"
            done
          }
          if [ -n "${TAG:-}" ]; then
            sync_one "$TAG"
          else
            mapfile -t tags < <(gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName')
            for t in "${tags[@]}"; do
              sync_one "$t"
            done
          fi
